<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Search</h1>

    <form>

    <p>売り場: <span id="item-place" aria-live="polite"></span></p>

    <h2>店内マップ</h2>

    <div id="map">
        <div class="area">パン</div>
        <div class="area">総菜</div>
        <div class="area">祭事</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
